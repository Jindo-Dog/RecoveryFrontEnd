name: React Build Develop
on:
  push:
    branches:
      - develop

env:
  DOCKER_REGISTRY: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKER_REPOSITORY: recovery.front
  VERSION: 24

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}

    steps:
      - name: 1️⃣ 'Checkout GitHub Action'
        uses: actions/checkout@v4

      - name: 2️⃣ Build
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.VERSION }}
          cache: npm

      - name: 3️⃣ npm install
        run: npm ci

      - name: 4️⃣ type check
        run: npm run type-check

      - name: 5️⃣ npm build
        run: npm run build:${{ github.ref_name }}

      - name: 6️⃣ Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 7️⃣ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 7️⃣ Build and push image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPOSITORY }}:${{ github.ref_name }} \
            --push \
            .
